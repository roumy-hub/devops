# Project identification
sonar.projectKey=timesheet-devops
sonar.projectName=Timesheet DevOps Project
sonar.projectVersion=1.0

# Project metadata
sonar.projectDescription=Spring Boot Timesheet application with DevSecOps pipeline

# Path to source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java specific properties
sonar.java.source=11
sonar.java.target=11
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

# Test coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/entities/**,**/config/**,**/Application.java

# Quality Gate
sonar.qualitygate.wait=true

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.json,**/*.md,**/*.yml,**/*.yaml
sonar.test.inclusions=**/*Test.java,**/*IT.java

# Test execution reports
sonar.junit.reportsPath=target/surefire-reports
sonar.surefire.reportsPath=target/surefire-reports

# Security settings
sonar.cpd.exclusions=**/entities/**,**/dto/**
sonar.cpd.minimumTokens=100

# Language
sonar.language=java

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis mode
sonar.analysis.mode=publish
